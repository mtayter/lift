# Lift Log: https://<your-hostname>/lift/ -> local backend
# Install: copy to /etc/apache2/conf-available/lift.conf,
#          a2enconf lift, then reload apache.
# Port 18794 must match "port" in config.json.
<Location /lift/>
    ProxyPass http://127.0.0.1:18794/
    ProxyPassReverse http://127.0.0.1:18794/
</Location>
